name: Build ContaSimp Terreno v1.41.61

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SIGNING_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detect signing setup
        id: signing
        shell: bash
        run: |
          if [ -n "$SIGNING_KEY_B64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore stable signing key
        if: steps.signing.outputs.ready == 'true'
        run: echo "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/contasimp-terreno-release.jks"

      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/contasimp-terreno-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.SIGNING_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ env.SIGNING_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.SIGNING_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename signed APK
        if: steps.signing.outputs.ready == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk ContaSimp-Terreno-v1.41.61.apk

      - name: Build debug APK while signing secrets are pending
        if: steps.signing.outputs.ready != 'true'
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename debug APK
        if: steps.signing.outputs.ready != 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk ContaSimp-Terreno-v1.41.61-DEBUG-NO-ACTUALIZAR.apk

      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContaSimp-Terreno-v1.41.61-SIGNED
          path: ContaSimp-Terreno-v1.41.61.apk
          if-no-files-found: error

      - name: Upload temporary debug APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ContaSimp-Terreno-v1.41.61-DEBUG-NO-ACTUALIZAR
          path: ContaSimp-Terreno-v1.41.61-DEBUG-NO-ACTUALIZAR.apk
          if-no-files-found: error
